{% extends 'base.html' %}
{% block content %}
<div class="auth card">
    <h1>Join BasketBee</h1>
    <form method="post" class="form">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="button">Create account</button>
    </form>
    <p>Already shopping? <a href="{% url 'login' %}">Log in</a></p>
</div>
{% endblock %}
